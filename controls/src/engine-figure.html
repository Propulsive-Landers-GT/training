<figure class="engine-fig" aria-labelledby="engine-fig-t">
<svg viewBox="0 0 300 340" role="img" aria-labelledby="engine-fig-t engine-fig-d">
  <title id="engine-fig-t">The three servos the controller commands</title>
  <desc id="engine-fig-d">A rocket engine hanging below a tank. A valve on the nitrous line opens and closes to set thrust. The engine swivels left and right on one gimbal axis and toward and away from you on the other. The flame changes length with the valve.</desc>
  <defs>
    <marker id="ef-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--ink-3)"/></marker>
  </defs>
  <!-- tank and feed line -->
  <rect class="ef-body" x="118" y="14" width="64" height="70" rx="10"/>
  <text x="150" y="53" text-anchor="middle" class="ef-label">N₂O</text>
  <path class="ef-line" d="M150 84 V112"/>
  <!-- throttle valve: the disc rotates -->
  <g transform="translate(150 124)">
    <circle class="ef-body" r="13"/>
    <g class="ef-valve"><rect x="-2" y="-11" width="4" height="22" rx="1" style="fill:var(--gold)"/></g>
    <text x="24" y="4" class="ef-label">throttle valve</text>
    <text x="24" y="17" class="ef-dim">servo 1</text>
  </g>
  <path class="ef-line" d="M150 137 V162"/>
  <!-- gimbal ring (pivot) -->
  <ellipse class="ef-ring" cx="150" cy="170" rx="30" ry="8"/>
  <text x="188" y="168" class="ef-label">gimbal</text>
  <text x="188" y="181" class="ef-dim">servos 2 and 3</text>
  <!-- the engine, pivoting about the ring -->
  <g class="ef-engine" transform="translate(150 170)">
    <g class="ef-pitch">
      <g class="ef-yaw">
        <path class="ef-body" d="M-10 0 H10 L14 32 L20 48 H-20 L-14 32 Z"/>
        <path class="ef-body" d="M-20 48 L-30 92 H30 L20 48 Z"/>
        <!-- flame: length driven by the same timing as the valve -->
        <g class="ef-flame">
          <path d="M-22 92 Q-18 140 0 170 Q18 140 22 92 Z" style="fill:var(--gold);opacity:.85"/>
          <path d="M-10 92 Q-8 120 0 138 Q8 120 10 92 Z" style="fill:var(--bg);opacity:.85"/>
        </g>
      </g>
    </g>
  </g>
  <!-- axis hints -->
  <path class="ef-axis" d="M62 170 H100" marker-end="url(#ef-arr)"/>
  <path class="ef-axis" d="M238 170 H200" marker-end="url(#ef-arr)"/>
  <text x="62" y="158" class="ef-dim">pitch axis</text>
  <path class="ef-axis" d="M150 214 L150 250" marker-end="url(#ef-arr)" style="opacity:.55"/>
  <text x="156" y="248" class="ef-dim">yaw axis (toward you)</text>
  <!-- thrust readout -->
  <text x="20" y="318" class="ef-dim">thrust</text>
  <rect x="20" y="322" width="120" height="6" rx="3" style="fill:var(--bg-3)"/>
  <rect class="ef-thrust" x="20" y="322" width="60" height="6" rx="3" style="fill:var(--gold)"/>
</svg>
<figcaption>Three servos, three angles. The valve sets thrust, the gimbal points it. The controller writes all three every few milliseconds.</figcaption>
</figure>
